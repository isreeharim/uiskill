<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uiskill — Live Component Preview & Code Copier</title>
    <meta name="description" content="uiskill: Live interactive preview and one-click code copy across 25+ UI ecosystems with 54 components and 32 specialized agent skills." />
    <script>
      // Apply the saved theme before React paints to prevent a light/dark flash.
      try {
        const theme = localStorage.getItem("skill-ui-theme")
        document.documentElement.classList.toggle("dark", theme !== "light")
      } catch {
        document.documentElement.classList.add("dark")
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#0071E3] selection:text-white min-h-screen bg-[#F5F5F7] text-[#1D1D1F] dark:bg-[#000000] dark:text-[#F5F5F7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
